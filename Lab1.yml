
trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  projectPath: 'Lab1MVCCoreApp/MyWebApp/MyWebApp/MyWebApp.csproj'
  azureServiceConnection: 'sc-azure-dev'
  appName: 'lab1-mywebapp-dev'
  resourceGroup: 'azvmsouthindia'

stages:
  # =====================================================
  # STAGE 1: BUILD, PUBLISH AND PACKAGE
  # =====================================================
  - stage: Build
    displayName: 'Build and Package MyWebApp'

    jobs:
      - job: BuildWebApp
        displayName: 'Publish ASP.NET Core MVC application'

        steps:
          - checkout: self
            clean: true

          - task: UseDotNet@2
            displayName: 'Install .NET 10 SDK'
            inputs:
              packageType: 'sdk'
              version: '10.x'

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: '$(project)'

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: '$(project)'
      arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Publish application'
            inputs:
              command: 'publish'
              publishWebProjects: false
              projects: '$(projectPath)'
              arguments: >-
                --configuration $(buildConfiguration)
                --output $(Build.ArtifactStagingDirectory)/publish
                --no-restore
              zipAfterPublish: false
              modifyOutputPath: false

          # Validate published output before packaging.
          - task: PowerShell@2
            displayName: 'Validate published files'
            inputs:
              targetType: 'inline'
              script: |
                $publishPath = "$(Build.ArtifactStagingDirectory)/publish"

                if (!(Test-Path "$publishPath/MyWebApp.dll")) {
                    throw "MyWebApp.dll is missing from the publish directory."
                }

                if (!(Test-Path "$publishPath/MyWebApp.runtimeconfig.json")) {
                    throw "MyWebApp.runtimeconfig.json is missing."
                }

                Write-Host "Published application files:"
                Get-ChildItem -Path $publishPath

          # Package the contents of publish, not its parent folder.
          - task: ArchiveFiles@2
            displayName: 'Create deployment ZIP'
            inputs:
              rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
              includeRootFolder: false
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/MyWebApp.zip'
              replaceExistingArchive: true

          # Verify that the DLL is at the ZIP root.
          - task: PowerShell@2
            displayName: 'Validate deployment ZIP'
            inputs:
              targetType: 'inline'
              script: |
                $zipPath = "$(Build.ArtifactStagingDirectory)/MyWebApp.zip"

                if (!(Test-Path $zipPath)) {
                    throw "Deployment ZIP was not created."
                }

                $entries = @(tar -tf $zipPath)

                if ($LASTEXITCODE -ne 0) {
                    throw "Unable to read deployment ZIP."
                }

                $entries | Select-Object -First 40

                if ($entries -notcontains "MyWebApp.dll") {
                    throw "MyWebApp.dll is not at the root of the ZIP."
                }

                if ($entries -notcontains "MyWebApp.runtimeconfig.json") {
                    throw "Runtime configuration is missing from the ZIP."
                }

          - task: PublishPipelineArtifact@1
            displayName: 'Publish deployment artifact'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/MyWebApp.zip'
              artifact: 'drop'
              publishLocation: 'pipeline'

  # =====================================================
  # STAGE 2: DEPLOY TO AZURE APP SERVICE
  # =====================================================
  - stage: Deploy
    displayName: 'Deploy MyWebApp to Azure'
    dependsOn: Build
    condition: succeeded()

    jobs:
      - deployment: DeployWebApp
        displayName: 'Deploy ASP.NET Core application'
        environment: 'dev'

        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

        - task: AzureWebApp@1
          displayName: Deploy to Azure App Service
          inputs:
            azureSubscription: '$(azureServiceConnection)'
            appType: webApp
            appName: '$(azureWebAppName)'
            package: '$(Pipeline.Workspace)/drop/MyWebApp.zip'
